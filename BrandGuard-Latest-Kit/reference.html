function render(){let hash=location.hash.slice(1)||'home',page=hash.split('/')[0];if(['home','login','signup'].includes(page)){renderExperience(page);return;}document.body.classList.remove('experience-mode','auth-mode');cleanupExperience();if(!pages.some(x=>x[0]===page)&&page!=='content'&&page!=='review')page='overview';$('#nav').innerHTML=pages.map(([id,name])=>`<a href="#${id}" class="${id===(['content','review'].includes(page)?'reviews':page)?'active':''}" ${id===(['content','review'].includes(page)?'reviews':page)?'aria-current="page"':''}>${svg(id)}${name}${id==='reviews'?'<span class="badge">'+content.filter(c=>['In review','Escalated'].includes(c.status)).length+'</span>':''}</a>`).join('');$('#breadcrumb').innerHTML=`Workspace <b>/</b> ${['content','review'].includes(page)?'Content review':pages.find(x=>x[0]===page)?.[1]}`;$('#view').innerHTML=({overview,reviews,brand,insights,new:newContent,about}[page]||(()=>detail(hash.split('/')[1])))();$('#view').classList.remove('page-enter');void $('#view').offsetWidth;$('#view').classList.add('page-enter');$('.sidebar').classList.remove('open');bind();applyPanelMotion();}
function bind(){document.querySelectorAll('[data-open]').forEach(el=>{el.onclick=()=>location.hash='content/'+el.dataset.open;el.onkeydown=e=>{if(e.key==='Enter')el.click()}});document.querySelectorAll('[data-period]').forEach(el=>el.onclick=()=>{period=el.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>{x.classList.toggle('active',x===el);x.setAttribute('aria-pressed',x===el)});$('#trend').innerHTML=chart();bindChart()});bindChart();document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{currentTab=el.dataset.tab;render()});document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{queueFilter=el.dataset.filter;render()});if($('#queue-search'))$('#queue-search').oninput=e=>{$('#queue-table').innerHTML=table(content.filter(c=>(queueFilter==='All content'||c.status===queueFilter)&&c.title.toLowerCase().includes(e.target.value.toLowerCase())));document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>location.hash='content/'+x.dataset.open)};document.querySelectorAll('[data-sample]').forEach(el=>el.onclick=()=>{let i=Number(el.dataset.sample),s=i===0?initial[0]:i===1?initial[1]:i===3?initial[3]:{title:'Summer sale poster',channel:'Email',copy:'Our biggest summer glow. Guaranteed results. Discover GlowLeaf lip care at ₹199.'};let f=$('#draft-form');f.elements.title.value=s.title;f.elements.channel.value=s.channel;f.elements.copy.value=s.copy;toast('Sample loaded. Make it your own.')});if($('#draft-file'))$('#draft-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)return toast('Please choose a file under 10 MB.');let text=await file.text();if(file.name.endsWith('.html'))text=new DOMParser().parseFromString(text,'text/html').body.textContent;$('#draft-form').elements.copy.value=text;toast('Text imported locally.')};if($('#draft-form'))$('#draft-form').onsubmit=e=>{e.preventDefault();let f=e.target,copy=f.elements.copy.value,localFindings=lipFindings.filter(x=>x[5]&&copy.toLowerCase().includes(x[5].toLowerCase()));if(f.elements.ai.checked&&!/created using ai|ai-generated/i.test(copy))localFindings.push(['AI disclosure may be missing','Consider a visible AI-created label.','RULE-DISC-AI-001','Medium','Created using AI','']);let c={id:'local-'+Date.now(),title:f.elements.title.value,channel:f.elements.channel.value,copy,status:'Checked',findings:localFindings.length,localFindings,version:1,custom:true,audit:['Draft created','Local preview checks completed']};content.unshift(c);persist();location.hash='content/'+c.id;toast('Local preview checks completed.')};document.querySelectorAll('[data-decision]').forEach(el=>el.onclick=()=>{let {id,index,decision}=el.dataset;if(decision==='Edited')return modal(`<h2>Edit suggestion</h2><p>Write the replacement you want to apply when saving a new version.</p><form id="edit-decision"><textarea name="replacement" required>${esc(getFindings(content.find(c=>c.id===id))[index][4])}</textarea><button class="btn primary" style="margin-top:18px">Save edited suggestion</button></form>`),$('#edit-decision').onsubmit=e=>{e.preventDefault();decisions[id+'-'+index]='Edited';decisions[id+'-'+index+'-text']=e.target.elements.replacement.value;persist();$('#modal').close();render()};decisions[id+'-'+index]=decision;persist();render();toast('Suggestion '+decision.toLowerCase()+'. Saved locally.')});document.querySelectorAll('[data-source]').forEach(el=>el.onclick=()=>{let r=ruleData.find(x=>x[0]===el.dataset.source);modal(`<div class="eyebrow">Rule context</div><h2>${r?.[1]||'Brand standard'}</h2><code class="code">${el.dataset.source}</code><p>${r?.[3]==='A'?'A deterministic check based on the configured rule library.':'An AI finding that must be grounded in approved brand sources.'}</p><p>Review the full guideline and evidence before making a decision. Regulatory summaries are not legal advice.</p><a href="#brand" class="btn primary" onclick="document.querySelector('dialog').close()">View brand library ↗</a>`)});document.querySelectorAll('[data-workflow]').forEach(el=>el.onclick=()=>{let c=content.find(x=>x.id===el.dataset.id),next=el.dataset.workflow;modal(`<h2>${next==='Approved'?'Approve content':next==='In review'?'Submit for review':next}?</h2><p>This updates the local frontend demo only.</p><form id="workflow-form"><label class="field">${next==='Approved'?'Override reason (required while high-severity findings remain)':'Decision reason'}<textarea name="reason" ${next!=='In review'?'required':''} placeholder="Explain your decision…"></textarea></label><button class="btn primary">Confirm local decision ↗</button></form>`);$('#workflow-form').onsubmit=e=>{e.preventDefault();c.status=next;(c.audit||=[]).push(next+(e.target.elements.reason.value?': '+e.target.elements.reason.value:''));persist();$('#modal').close();render();toast('Local workflow updated.')};});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.id));if($('#comment-form'))$('#comment-form').onsubmit=e=>{e.preventDefault();let c=content.find(x=>x.id===e.target.dataset.id);(c.comments||=[]).push(e.target.elements.comment.value);(c.audit||=[]).push('Comment added');persist();render();toast('Comment saved locally.')};}
function bindChart(){document.querySelectorAll('.chart-point').forEach(el=>{let show=()=>{let t=$('.chart-tooltip');if(!t)return;t.textContent=el.dataset.value;t.style.left=Math.min(el.getBoundingClientRect().left-el.closest('.chart-wrap').getBoundingClientRect().left,el.closest('.chart-wrap').clientWidth-190)+'px';t.style.top='5px';t.classList.add('show')};el.onmouseenter=show;el.onfocus=show;el.onmouseleave=()=>$('.chart-tooltip')?.classList.remove('show');el.onblur=el.onmouseleave})}
function action(name,id){if(name==='export'){let csv='Metric,Value\nContent reviewed,32\nTotal findings,109\nApprovals,9\nApproval overrides,3\n\nContent,Channel,Findings,Status\n'+content.map(c=>[c.title,c.channel,c.findings,c.status].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='brandguard-governance-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Report exported.')}if(name==='add-source'){modal('<h2>Add a brand source</h2><p>Sources added here are stored only in this browser preview.</p><form id="source-form"><label class="field">Title<input name="title" required></label><label class="field">Citation code<input name="code" placeholder="GUIDE-NEW-01" required></label><label class="field">Source text<textarea name="text" required></textarea></label><button class="btn primary">Add to guidelines ↗</button></form>');$('#source-form').onsubmit=e=>{e.preventDefault();sourceData.Guidelines.push([esc(e.target.elements.code.value),esc(e.target.elements.title.value),esc(e.target.elements.text.value)]);currentTab='Guidelines';$('#modal').close();render();toast('Source added to this preview session.')}}if(name==='history'){let c=content.find(x=>x.id===id);modal(`<h2>Version history</h2><div class="timeline">${Array.from({length:c.version},(_,i)=>`<div>Version ${i+1}<small>${i?'Applied accepted and edited suggestions':'Initial content'}</small></div>`).join('')}</div><p>Original demo versions are shown as metadata. Local saved versions retain their previous copy for comparison.</p>${c.previousCopy?`<h3>Previous version</h3><p>${esc(c.previousCopy)}</p><h3>Current version</h3><p>${esc(c.copy)}</p>`:''}`)}if(name==='version'){let c=content.find(x=>x.id===id);c.previousCopy=c.copy;getFindings(c).forEach((f,i)=>{let d=decisions[id+'-'+i];if(d==='Accepted'&&f[5])c.copy=c.copy.replace(f[5],f[4]);if(d==='Edited'){const edit=decisions[id+'-'+i+'-text'];c.copy=f[5]?c.copy.replace(f[5],edit):c.copy+'\n'+edit}});c.version++;(c.audit||=[]).push('Version '+c.version+' saved locally');persist();render();toast('New version saved with accepted edits.')}}
$('#modal .close').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close()};$('#mobile-menu').onclick=()=>$('.sidebar').classList.toggle('open');$('#help').onclick=()=>location.hash='about';$('#role').onchange=()=>{let role=$('#role').value,profiles={Admin:['Asha Admin','Workspace administrator','AA'],Creator:['Chirag Creator','Content creator','CC'],Manager:['Meera Manager','Brand manager','MM'],Reviewer:['Rohan Reviewer','Legal & compliance','RR']},p=profiles[role];$('.profile').innerHTML=`<span class="avatar light">${p[2]}</span><div>${p[0]}<small>${p[1]}</small></div>`;$('.tiny').textContent=p[2];render();toast('Preview role changed to '+role)};window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});render();
